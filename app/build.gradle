plugins { id 'com.android.application' }

android {
    namespace 'jp.phocorin.ngwordparty'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.phocorin.ngwordparty'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            assets.srcDirs = [layout.buildDirectory.dir('generated/webAssets')]
        }
    }
}

def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    from(rootProject.files('index.html', 'manifest.webmanifest', 'sw.js'))
    into(layout.buildDirectory.dir('generated/webAssets'))
}
tasks.named('preBuild').configure { dependsOn(syncWebAssets) }
